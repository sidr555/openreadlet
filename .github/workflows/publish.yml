name: publish

on:
  push:
    tags: ['v*']
  # A tag pushed while Actions is unavailable may never get a run, and the trigger above
  # cannot be replayed without deleting and re-pushing the tag — which is the last thing to
  # do to a release tag. This is the way back in.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run publishes the commit its tag points at, never the head of a branch:
          # otherwise a dispatch would ship code that no tag names, and the version check
          # below would be the only thing standing between that and the registry.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Check tag matches package.json version
        # Through the environment rather than interpolated into the script: on a manual run
        # the tag is whatever the caller typed.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${TAG#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
